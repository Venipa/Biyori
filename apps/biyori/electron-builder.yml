# yaml-language-server: $schema=https://raw.githubusercontent.com/electron-userland/electron-builder/refs/heads/master/packages/app-builder-lib/scheme.json


appId: net.venipa.biyori
productName: Biyori
extraMetadata:
  name: Biyori
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: drizzle
    to: drizzle
asarUnpack:
  - resources/**
  - "**/{better-sqlite3,anitomy}/**"
  - "**/*favicon*"
  - "**/*32x32*"
  - "**/*16x16*"
  - "**/*icon*.icns"
  - "**/*.icns"
  - "**/*.ico"
  - "**/assets/**"
win:
  executableName: biyori
  artifactName: ${name}-${version}-setup.${ext}
  compression: maximum
  target:
    - target: nsis
      arch: x64
  icon: build/icon.ico
nsis:
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  installerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  deleteAppDataOnUninstall: true
