# yaml-language-server: $schema=https://raw.githubusercontent.com/electron-userland/electron-builder/refs/heads/master/packages/app-builder-lib/scheme.json


appId: net.venipa.biyori
productName: Biyori
extraMetadata:
  name: Biyori
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!**/*.map'
  - '!**/@biyori/hana/target/**'
  - '!**/@biyori/hana/src/**'
  - '!**/@biyori/hana/{Cargo.toml,Cargo.lock,build.rs,.gitignore}'
extraResources:
  - from: drizzle
    to: drizzle
asarUnpack:
  - resources/**
  - "**/better-sqlite3/**"
  - "**/*.node"
  - "**/*favicon*"
  - "**/*32x32*"
  - "**/*16x16*"
  - "**/*icon*.icns"
  - "**/*.icns"
  - "**/*.ico"
  - "**/assets/**"
win:
  executableName: biyori
  artifactName: ${name}-${version}-setup.${ext}
  compression: maximum
  target:
    - target: nsis
      arch: x64
  icon: build/icon.ico
nsis:
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  installerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  deleteAppDataOnUninstall: true
mac:
  category: public.app-category.entertainment
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSDocumentsFolderUsageDescription: Biyori needs access to your library folders.
    NSDownloadsFolderUsageDescription: Biyori needs access to downloaded files.
    NSScreenCaptureUsageDescription: Biyori uses window titles to detect playback.
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  artifactName: ${name}-${version}-mac-arm64.${ext}
dmg:
  artifactName: ${name}-${version}-mac-arm64.${ext}
linux:
  executableName: biyori
  maintainer: Venipa <https://github.com/Venipa>
  category: AudioVideo
  synopsis: Anime library tracker
  icon: build
  target:
    - target: AppImage
      arch:
        - x64
appImage:
  artifactName: ${name}-${version}-linux-x64.${ext}
npmRebuild: true
protocols:
  name: Biyori
  schemes:
    - biyori
publish:
  provider: github
  owner: Venipa
  repo: biyori
