name: Release Desktop App

on:
  push:
    tags:
      - "v*"

# One release per tag; do not cancel mid-publish (assets would be partial).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  BUN_VERSION: "1.4.0"
  COMPILE_ARTIFACT: electron-compile

jobs:
  # Shared electron-vite build. Pack jobs download this artifact and run electron-builder only.
  compile:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.getVersion.outputs.value }}
      version_ok: ${{ steps.getVersion.outputs.ok }}
      channel: ${{ steps.getVersion.outputs.releaseType }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - if: github.ref_type == 'tag'
        id: getVersion
        uses: actions/github-script@v9
        env:
          REF_NAME: ${{ github.ref_name }}
        with:
          script: |
            const isVersion = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/
            const id = process.env.REF_NAME && process.env.REF_NAME.split('v')[1] || process.env.REF_NAME
            const isRC = id.includes('-rc.')
            const isAlpha = id.includes('-a.') || id.includes('-alpha.')
            core.setOutput("value", id);
            core.setOutput("ok", String(isVersion.test(id)))
            core.setOutput("releaseType", isAlpha ? 'alpha' : isRC ? 'beta' : 'stable')

      - if: github.ref_type == 'tag' && steps.getVersion.outputs.ok == 'true'
        name: set app version
        shell: bash
        env:
          APP_VERSION: ${{ steps.getVersion.outputs.value }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const p = 'apps/biyori/package.json';
          const text = fs.readFileSync(p, 'utf8');
          const next = text.replace(/("version"\s*:\s*")[^"]*(")/, `$1${process.env.APP_VERSION}$2`);
          fs.writeFileSync(p, next);
          EOF

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile Electron app
        run: bun run release:compile
        env:
          VITE_ANILIST_CLIENT_ID: ${{ secrets.VITE_ANILIST_CLIENT_ID }}
          VITE_DISCORD_CLIENT_ID: ${{ secrets.VITE_DISCORD_CLIENT_ID }}
          VITE_APP_UPDATE_CHANNEL: ${{ steps.getVersion.outputs.releaseType }}
          VITE_APP_GIT_HASH: ${{ github.sha }}
          VITE_REPO_OWNER: ${{ github.repository_owner }}
          VITE_REPO_NAME: ${{ github.event.repository.name }}

      - name: Verify compile output
        shell: bash
        run: |
          test -f apps/biyori/out/main/index.js
          test -d apps/biyori/drizzle

      - name: Upload compile artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.COMPILE_ARTIFACT }}
          path: |
            apps/biyori/out
            apps/biyori/drizzle
          if-no-files-found: error
          retention-days: 3

      - name: Ensure draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          title="v${{ steps.getVersion.outputs.value }} - "
          channel="${{ steps.getVersion.outputs.releaseType }}"
          prerelease_flag=()
          if [ "$channel" = "beta" ] || [ "$channel" = "alpha" ]; then
            prerelease_flag=(--prerelease)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            gh release create "$tag" --draft "${prerelease_flag[@]}" --title "$title" --notes "Publishing assets…"
          fi

  build-windows:
    needs: compile
    runs-on: windows-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - if: needs.compile.outputs.version_ok == 'true'
        name: set app version
        shell: bash
        env:
          APP_VERSION: ${{ needs.compile.outputs.version }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const p = 'apps/biyori/package.json';
          const text = fs.readFileSync(p, 'utf8');
          const next = text.replace(/("version"\s*:\s*")[^"]*(")/, `$1${process.env.APP_VERSION}$2`);
          fs.writeFileSync(p, next);
          EOF

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Rust (windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Hana cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/hana

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download compile artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.COMPILE_ARTIFACT }}
          path: apps/biyori

      - name: Verify compile output
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "apps/biyori/out/main/index.js")) {
            throw "missing apps/biyori/out/main/index.js"
          }
          if (-not (Test-Path -LiteralPath "apps/biyori/drizzle")) {
            throw "missing apps/biyori/drizzle"
          }

      - name: Build Hana native
        run: bun run --cwd packages/hana build:release

      - name: Verify Hana Windows addon
        shell: pwsh
        run: |
          $addon = "packages/hana/dist/hana.win32-x64-msvc.node"
          if (-not (Test-Path -LiteralPath $addon)) {
            throw "missing $addon (napi build did not produce the Windows addon)"
          }
          Get-Item -LiteralPath $addon | Format-List Name, Length, LastWriteTime

      - name: Pack Windows x64 release
        working-directory: apps/biyori
        run: bunx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production

  finalize-release:
    needs:
      - build-windows
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Parse version from tag
        id: version
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          echo "Tag=$tag Version=$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release notes from commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          prev=""
          if prev=$(gh release list --exclude-drafts --limit 20 --json tagName --jq ".[] | select(.tagName != \"$tag\") | .tagName" | head -n1); then
            :
          else
            prev=""
          fi

          if [ -z "$prev" ]; then
            prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
          fi

          if [ -z "$prev" ]; then
            echo "No previous published release - listing all commits reachable from $tag"
            git log --pretty=tformat:"- %s (%h)" "$tag" > release-notes-commits.txt || true
          else
            echo "Commits: $prev..$tag"
            git log --pretty=tformat:"- %s (%h)" "$prev..$tag" > release-notes-commits.txt || true
          fi

          if [ ! -s release-notes-commits.txt ]; then
            echo "- No commits listed for this range." > release-notes-commits.txt
          fi

          {
            echo "## Changes"
            echo
            cat release-notes-commits.txt
            echo
          } > release-notes.md
          cat release-notes.md

      - name: Set draft release title and notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          prerelease_flag=()
          if [[ "$version" == *-* ]]; then
            prerelease_flag=(--prerelease)
          fi
          gh release edit "$tag" \
            --draft \
            "${prerelease_flag[@]}" \
            --title "v$version - " \
            --notes-file release-notes.md
