[package]
name = "hana"
version = "0.1.0"
edition = "2021"
publish = false
description = "Hana. native subsidary for the Biyori."
license = "Apache-2.0"

[lib]
name = "hana"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
regex = { version = "1", default-features = false, features = ["std"] }
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"
serde_json = "1"
sysinfo = "0.33"
dua-core = "3.3.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
	"Win32_Foundation",
	"Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
napi-build = "2"
